name: ORION Safety Evaluation
description: Evaluate your autonomous driving model against ORION safety scenarios
author: ORION Evaluation Platform

inputs:
  model_path:
    required: true
    description: Python import path to your ModelInterface class (e.g. myproject.model.MyModel)
  scenarios:
    required: false
    default: all
    description: Comma-separated scenario IDs or category names (LON, LAT, INT, VRU, EMG, MLT, or all)
  runs_per_scenario:
    required: false
    default: "10"
    description: Number of seeded runs per scenario
  pass_threshold:
    required: false
    default: "0.80"
    description: Minimum fraction of scenarios that must pass (0.0-1.0)
  seed:
    required: false
    default: "42"
    description: Master seed; the same seed gives the same runs on any machine
  baseline_report:
    required: false
    default: ""
    description: >-
      Path to a previous orion_suite_report.json, usually restored from the
      last run on your default branch. Leave empty to skip the regression check.
  fail_on_regression:
    required: false
    default: "true"
    description: Fail the step when scores drop past the regression thresholds vs baseline_report
  output_dir:
    required: false
    default: orion-results
    description: Directory in the workspace for the report; upload it as an artifact to use as the next baseline
  api_key:
    required: false
    default: ""
    description: >-
      Reserved for the hosted API. This action runs the suite locally in its own
      container and needs no credential, so leaving this unset is correct.

outputs:
  composite_score:
    description: Mean composite safety score across scenarios (0.0-1.0)
  safety_score:
    description: Mean safety score across scenarios (0.0-1.0)
  collision_rate:
    description: Mean collision rate across scenarios
  pass_rate:
    description: Fraction of scenarios that passed
  scenarios_passed:
    description: Number of scenarios that passed
  scenario_count:
    description: Number of scenarios run
  passed:
    description: Literal 'true' when the step exited 0 — threshold met and no regression

runs:
  using: docker
  # Must match exactly what .github/workflows/docker-build.yml pushes. GitHub
  # does not allow expressions in this field, so the owner cannot be templated
  # and the two have to be kept in step by hand -- if the project moves to an
  # `orioneval` org, change both.
  #
  # This previously read `ghcr.io/orioneval/cli:latest`, an image nobody built
  # or pushed: docker-build.yml tagged the CLI locally inside the runner and
  # the tag evaporated when the job ended. The action therefore failed on image
  # pull for anyone who added it, which is worse than unbuilt because the
  # roadmap recorded it as shipped.
  image: docker://ghcr.io/anandharshit712/orion-cli:latest
  # The image's own ENTRYPOINT is run_suite, which ignores these variables
  # entirely. Without this override the action ran the suite with default
  # arguments and produced no outputs at all.
  entrypoint: /usr/local/bin/orion-ci
  env:
    ORION_MODEL_PATH: ${{ inputs.model_path }}
    ORION_SCENARIOS: ${{ inputs.scenarios }}
    ORION_RUNS_PER_SCENARIO: ${{ inputs.runs_per_scenario }}
    ORION_PASS_THRESHOLD: ${{ inputs.pass_threshold }}
    ORION_SEED: ${{ inputs.seed }}
    ORION_OUTPUT_DIR: ${{ inputs.output_dir }}
    ORION_BASELINE_REPORT: ${{ inputs.baseline_report }}
    ORION_FAIL_ON_REGRESSION: ${{ inputs.fail_on_regression }}
    ORION_API_KEY: ${{ inputs.api_key }}

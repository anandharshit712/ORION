name: Lint

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install linting tools
        working-directory: arep_implementation
        # The versions are pinned in pyproject. This step used to install
        # whatever ruff had published that morning, which is why Lint had been
        # red on every run since 0.16 changed the default rule set.
        #
        # api and worker are installed for mypy, not for the linters. With only
        # [dev] present, fastapi, sqlalchemy, stripe and celery are missing and
        # mypy reports an unresolved import for each - checking a different
        # program than the one that ships. Black and Ruff do not care either way.
        run: pip install -e ".[dev,api,worker]"
      - name: Black
        working-directory: arep_implementation
        run: black --check arep/ tests/ scripts/
      - name: Ruff
        working-directory: arep_implementation
        run: ruff check arep/ tests/ scripts/
      - name: Mypy
        working-directory: arep_implementation
        run: mypy arep/

name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  # SQLite matrix: fast, and it is what developers actually run locally.
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        working-directory: arep_implementation
        # worker extras included: the batch and reliability suites import celery
        # and cloudpickle, and without them 13 tests error rather than run.
        #
        # search too, for cma and scikit-learn. Adversarial search and failure
        # clustering are shipped features; without the extra, 10 of their tests
        # failed here on an import while passing on every developer machine that
        # happened to have the packages. They skip if the extra is ever dropped,
        # but the point is to run them.
        run: pip install -e ".[dev,api,worker,search]"
      - name: Run tests
        working-directory: arep_implementation
        # Captured so the failure can be summarised below. pipefail keeps
        # pytest's exit code rather than tee's, which is always 0.
        run: |
          set -o pipefail
          pytest --tb=short -q 2>&1 | tee pytest.log

      - name: Summarise failures
        if: failure()
        working-directory: arep_implementation
        run: |
          {
            echo "### pytest failures (Python ${{ matrix.python-version }})"
            echo
            echo '```'
            grep -E "^(FAILED|ERROR)" pytest.log | head -40 || true
            echo
            tail -40 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          # Also as annotations. A job summary is stored separately and needs an
          # authenticated call to read; annotations come back in the check-run
          # payload of a public repo without credentials. That difference is
          # the whole reason a red build was undiagnosable from outside.
          grep -E "^(FAILED|ERROR)" pytest.log | head -20             | while IFS= read -r line; do echo "::error::py${{ matrix.python-version }} $line"; done

  # Postgres job: dev/prod parity (D-13).
  #
  # SQLite silently no-ops `SELECT ... FOR UPDATE`, which is what the atomic
  # credit deduction relies on. A race that corrupts a customer's balance is
  # therefore invisible in the matrix above by construction. This job is also
  # the only place the Alembic chain runs at all — migration 002 uses an ALTER
  # with a constraint, which SQLite cannot do, so `alembic upgrade head` has
  # never been executable against the dev database.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: orion
          POSTGRES_PASSWORD: orion_ci_password
          POSTGRES_DB: orion_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      ORION_ENV: test
      ORION_DATABASE_URL: postgresql://orion:orion_ci_password@localhost:5432/orion_test
      ORION_REDIS_URL: redis://localhost:6379/0
      # Non-dev environments refuse to boot without a strong secret, so CI
      # supplies one. It is public, disposable and used only here.
      ORION_SECRET_KEY: ci-only-secret-not-used-anywhere-else-32chars

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: arep_implementation
        run: pip install -e ".[dev,api,worker,search]"

      - name: Alembic upgrade → downgrade → upgrade
        working-directory: arep_implementation
        # Round trip, not just forward: a downgrade that does not work is found
        # during an incident, at the worst possible moment.
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

      - name: Run tests against Postgres with a coverage gate
        working-directory: arep_implementation
        run: |
          set -o pipefail
          pytest --tb=short -q \
            --cov=arep --cov-report=term-missing --cov-report=xml \
            --cov-fail-under=70 2>&1 | tee pytest.log

      - name: Summarise failures
        if: failure()
        working-directory: arep_implementation
        # Job logs need an authenticated API call; a job *summary* is readable
        # on a public repo without one. Putting the failures here is the
        # difference between diagnosing a red build and guessing at it.
        run: |
          {
            echo "### pytest failures (Postgres)"
            echo
            echo '```'
            grep -E "^(FAILED|ERROR)" pytest.log | head -40 || true
            echo
            grep -E "Required test coverage|TOTAL" pytest.log || true
            echo
            tail -60 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "^(FAILED|ERROR)|Required test coverage" pytest.log | head -20             | while IFS= read -r line; do echo "::error::postgres $line"; done

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: arep_implementation/coverage.xml
          if-no-files-found: warn

  # Frontend (Phase 2). There were no frontend tests at all until now, so a
  # React regression was caught by someone looking at the page.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: orion-frontend/package-lock.json
      - name: Install dependencies
        working-directory: orion-frontend
        run: npm ci
      - name: Unit tests
        working-directory: orion-frontend
        run: |
          set -o pipefail
          npm test 2>&1 | tee vitest.log

      - name: Summarise frontend failures
        if: failure()
        working-directory: orion-frontend
        run: |
          {
            echo "### frontend failures"
            echo
            echo '```'
            tail -60 vitest.log 2>/dev/null || echo "no vitest output — the failure was earlier (npm ci?)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAIL|✕|Error:" vitest.log 2>/dev/null | head -20             | while IFS= read -r line; do echo "::error::frontend $line"; done || true
      - name: Production build
        working-directory: orion-frontend
        # A build failure is a real failure: the app ships as a bundle.
        run: npm run build

  # The hard rules from CLAUDE.md, enforced mechanically rather than by review.
  hard-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check simulation purity
        working-directory: arep_implementation
        run: python scripts/check_hard_rules.py

scenario:
  name: "EMG-004 Vehicle Control Loss — Sudden Black Ice Event"
  version: "1.0"
  description: >
    Ego enters a 50m road segment (x=80 to x=130) where friction drops instantly
    to 0.1 (ice). Ego must adapt steering and speed to avoid lane departure or
    spinout (yaw slip <=15 deg). Maps to NHTSA Pre-Crash Type 01.
    NOTE: Requires Level-3 physics (dynamic friction) for full fidelity.
  behavioral_requirement: >-
    The ego must keep control across a 50 m black-ice patch where friction falls to
    0.1, adapting speed and steering to avoid lane departure or a spin (yaw slip of at
    most 15 degrees).
  hazard: >-
    Triggering condition: the ego enters a road segment (x 80-130 m) where surface
    friction drops abruptly to ice. Hazardous event: loss of vehicle control leading
    to lane departure, run-off-road or spin (NHTSA pre-crash type 1).
  verification_gap: >-
    Not executed. The scenario is refused at load because its change_weather event is
    not implemented (DI-02); ORION has no friction zones and the default kinematic
    physics ignores friction (DI-01). Nothing about ice is covered.
  duration: 20.0

ego:
  initial:
    x: 0.0
    y: -1.75
    heading: 0.0
    velocity: 16.67   # 60 km/h
  constraints:
    max_velocity: 22.22
    max_acceleration: 2.0
    max_deceleration: 8.0
    max_steering: 0.5

environment:
  road:
    type: rural
    lanes: 2
    lane_width: 3.5
    speed_limit: 16.67
  weather:
    condition: snow
    visibility: 500.0

traffic: []

events:
  - type: change_weather
    trigger_time: 0.0
    parameters:
      condition: snow
      friction_mu: 0.1     # black ice patch begins at simulation start for this segment
      zone_x_start: 80.0
      zone_x_end: 130.0

termination:
  conditions:
    - collision
    - off_road
    - timeout
  timeout: 20.0

master_seed: 5004
parameterization:
  # Surface friction is set by the scenario, not varied here — it is what the
  # scenario *is*. Entry speed is the variable that decides whether the ego can
  # recover, and it is the one a customer can act on.
  ego_velocity:
    min: 11.11     # 40 km/h
    max: 22.22     # 80 km/h

master_seed: 5004

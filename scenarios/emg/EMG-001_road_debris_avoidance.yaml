scenario:
  name: "EMG-001 Road Debris Avoidance — Static Obstacle in Lane"
  version: "1.0"
  description: >
    Large static debris (truck tire) in ego's lane at highway speed. Ego must
    detect and perform an evasive lane change or emergency stop without collision.
    No advance warning. Debris first visible at approximately 50m.
  behavioral_requirement: >-
    The ego must avoid large stationary debris in its lane at highway speed by
    changing lane or stopping, where braking alone is insufficient on the fastest
    draws.
  hazard: >-
    Triggering condition: a large static object lies in the ego lane ahead. Hazardous
    event: collision with road debris at highway speed.
  verification_gap: >-
    Unproven as of 2026-10-30: no model in the repository passes it (emergency_brake
    collides, and ReferenceDriver leaves the road on 1 run in 10 at 10 runs per scenario),
    so it is not yet shown that the scenario is passable. The debris is a stationary car-sized object observable from the first frame; the
    50 m first-visibility distance in the description is not modelled.
  duration: 15.0

ego:
  initial:
    x: 0.0
    y: -1.75
    heading: 0.0
    velocity: 27.78   # 100 km/h
  constraints:
    max_velocity: 33.33
    max_acceleration: 3.0
    max_deceleration: 8.0
    max_steering: 0.5

environment:
  road:
    type: highway
    lanes: 2
    lane_width: 3.5
    speed_limit: 27.78
  weather:
    condition: clear
    visibility: 1000.0

traffic:
  - id: road_debris
    type: car      # using car as proxy for large obstacle; treat as stationary blocker
    initial:
      x: 80.0
      y: -1.75
      heading: 0.0
      velocity: 0.0
    behavior:
      type: constant_velocity
      parameters: {}

termination:
  conditions:
    - collision
    - off_road
    - timeout
  timeout: 15.0

master_seed: 5001
parameterization:
  # Motorway speeds with a static blocker: sighting distance decides whether
  # braking alone is enough or the model has to steer.
  ego_velocity:
    min: 22.22     # 80 km/h
    max: 33.33     # 120 km/h
  npc_overrides:
    road_debris:
      initial_x:
        min: 55.0
        max: 120.0

master_seed: 5001

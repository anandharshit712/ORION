scenario:
  name: "LON-001 Lead Vehicle Gradual Slowdown"
  version: "1.0"
  description: "Lead vehicle decelerates at -2 m/s2 from highway speed. Ego must close-regulate following distance without collision."
  behavioral_requirement: >-
    The ego must slow to hold a safe following gap behind a highway lead vehicle that
    decelerates steadily at about 2 m/s2 and settles at 40 km/h.
  hazard: >-
    Triggering condition: the lead vehicle in the ego lane begins a sustained moderate
    deceleration 3 s into the run. Hazardous event: rear-end collision with the lead
    vehicle.
  verification_gap: >-
    The parameterised initial_decel range is never read: the lead uses the scripted
    behaviour, which reads post_acceleration, so it decelerates at 2 m/s2 on every run
    and the deceleration does not vary as the parameterisation block implies.
  duration: 30.0

ego:
  initial:
    x: 0.0
    y: -1.75
    heading: 0.0
    velocity: 22.22   # 80 km/h
  constraints:
    max_velocity: 33.33
    max_acceleration: 3.0
    max_deceleration: 8.0
    max_steering: 0.5

environment:
  road:
    type: highway
    lanes: 2
    lane_width: 3.5
    speed_limit: 27.78   # 100 km/h
  weather:
    condition: clear
    visibility: 1000.0

traffic:
  - id: lead_vehicle
    type: car
    initial:
      x: 50.0
      y: -1.75
      heading: 0.0
      velocity: 22.22  # same as ego initially
    behavior:
      type: scripted
      parameters:
        trigger_type: time
        trigger_value: 3.0    # brakes 3 seconds into scenario
        post_acceleration: -2.0
        min_velocity: 11.11   # slows to 40 km/h

termination:
  conditions:
    - collision
    - off_road
    - timeout
  timeout: 30.0

master_seed: 1001
parameterization:
  # Approach speed and following distance are what make a gradual slowdown easy
  # or hard. The lead's deceleration stays gentle: a hard stop here would turn
  # this into LON-002, and one scenario tests one requirement.
  ego_velocity:
    min: 19.44     # 70 km/h
    max: 27.78     # 100 km/h
  npc_overrides:
    lead_vehicle:
      initial_x:
        min: 35.0
        max: 70.0
      initial_velocity:
        min: 19.44
        max: 27.78
      parameters:
        initial_decel:
          min: -2.5
          max: -1.0

master_seed: 1001

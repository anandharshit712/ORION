scenario:
  name: "VRU-005 E-Scooter in the Bike Lane - Fast, Narrow and Unstable"
  version: "2.0"
  description: >
    An e-scooter travels in the bike lane beside the ego at a speed between a
    cyclist and a car, wobbling as it goes. The requirement is lateral
    clearance while overtaking something narrow and unsteady: the swerve
    amplitude varies per run, so the clearance that was adequate on one draw is
    not on the next, and a fixed passing offset is not a strategy.
  duration: 22.0

ego:
  initial:
    x: 0.0
    y: -1.75
    heading: 0.0
    velocity: 12.50
  constraints:
    max_velocity: 16.67
    max_acceleration: 3.0
    max_deceleration: 8.83
    max_steering: 0.5

environment:
  road:
    type: urban
    lanes: 2
    lane_width: 3.5
    speed_limit: 13.89
  weather:
    condition: clear
    visibility: 900.0

traffic:
  - id: escooter
    type: bicycle
    initial:
      x: 30.0
      y: -4.6
      heading: 0.0
      velocity: 6.94
    behavior:
      type: reactive_vehicle
      parameters:
        bt_type: erratic_cyclist
        trigger_type: time
        trigger_value: 0.0
        forward_speed:
          min: 5.5
          max: 8.3
        swerve_magnitude:
          min: 0.4
          max: 1.3
        swerve_period:
          min: 1.0
          max: 2.5

termination:
  conditions:
    - collision
    - off_road
    - timeout
  timeout: 22.0

master_seed: 4005

parameterization:
  ego_velocity:
    min: 9.72
    max: 15.28
  ego_x_jitter:
    min: 0.0
    max: 6.0
  npc_overrides:
    escooter:
      initial_x:
        min: 18.0
        max: 45.0
      parameters:
        forward_speed:
          min: 4.2
          max: 9.7
        swerve_magnitude:
          min: 0.3
          max: 1.5

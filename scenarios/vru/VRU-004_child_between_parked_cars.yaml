scenario:
  name: "VRU-004 Child Running Between Parked Cars - Unoccluded"
  version: "2.0"
  description: >
    A child runs into the carriageway from between parked cars, at running pace
    and without hesitating. Deliberately not occluded: VRU-008 already tests the
    reveal, and this one isolates the other half of the problem - a small, fast
    body on a path that does not stop at the kerb. A cautious pedestrian model
    hesitates and gives the ego time; this one does not.
  duration: 18.0

ego:
  initial:
    x: 0.0
    y: -1.75
    heading: 0.0
    velocity: 11.11
  constraints:
    max_velocity: 16.67
    max_acceleration: 3.0
    max_deceleration: 8.83
    max_steering: 0.5

environment:
  road:
    type: urban
    lanes: 2
    lane_width: 3.5
    speed_limit: 11.11
  weather:
    condition: clear
    visibility: 800.0

traffic:
  - id: running_child
    type: pedestrian
    initial:
      x: 38.0
      y: -7.0
      heading: 1.5708
      velocity: 2.8
    behavior:
      type: pedestrian
      parameters:
        bt_type: erratic_pedestrian
        trigger_type: proximity
        trigger_value: 30.0
        walk_speed:
          min: 2.2
          max: 3.8
        direction_change_prob: 0.15

termination:
  conditions:
    - collision
    - off_road
    - timeout
  timeout: 18.0

master_seed: 4004

parameterization:
  ego_velocity:
    min: 8.33
    max: 13.89
  ego_x_jitter:
    min: 0.0
    max: 5.0
  npc_overrides:
    running_child:
      initial_x:
        min: 28.0
        max: 50.0
      initial_y:
        min: -9.0
        max: -5.0
      parameters:
        trigger_value:
          min: 20.0
          max: 38.0
        walk_speed:
          min: 2.0
          max: 4.2

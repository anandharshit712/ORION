scenario:
  name: "VRU-007 Group Crossing - Several Pedestrians, Staggered"
  version: "2.0"
  description: >
    Three pedestrians cross at staggered times rather than together. The
    requirement is that the road is not clear when the first one is: a model
    that resumes as soon as the nearest hazard passes meets the second, and the
    stagger is randomised so the rhythm cannot be learned. The group tests
    persistence of caution, not detection.
  duration: 22.0

ego:
  initial:
    x: 0.0
    y: -1.75
    heading: 0.0
    velocity: 11.11
  constraints:
    max_velocity: 16.67
    max_acceleration: 3.0
    max_deceleration: 8.83
    max_steering: 0.5

environment:
  road:
    type: urban
    lanes: 2
    lane_width: 3.5
    speed_limit: 11.11
  weather:
    condition: clear
    visibility: 900.0

traffic:
  - id: walker_first
    type: pedestrian
    initial:
      x: 40.0
      y: -8.0
      heading: 1.5708
      velocity: 1.4
    behavior:
      type: pedestrian
      parameters:
        bt_type: cautious_pedestrian
        trigger_type: proximity
        trigger_value: 28.0
        walk_speed:
          min: 1.1
          max: 1.8
        hesitate_prob: 0.2
  - id: walker_second
    type: pedestrian
    initial:
      x: 52.0
      y: -8.5
      heading: 1.5708
      velocity: 1.3
    behavior:
      type: pedestrian
      parameters:
        bt_type: cautious_pedestrian
        trigger_type: proximity
        trigger_value: 24.0
        walk_speed:
          min: 1.0
          max: 1.7
        hesitate_prob: 0.3
  - id: walker_third
    type: pedestrian
    initial:
      x: 66.0
      y: -7.5
      heading: 1.5708
      velocity: 1.5
    behavior:
      type: pedestrian
      parameters:
        bt_type: cautious_pedestrian
        trigger_type: proximity
        trigger_value: 20.0
        walk_speed:
          min: 1.2
          max: 2.0
        hesitate_prob: 0.15

termination:
  conditions:
    - collision
    - off_road
    - timeout
  timeout: 22.0

master_seed: 4007

parameterization:
  ego_velocity:
    min: 8.33
    max: 13.89
  ego_x_jitter:
    min: 0.0
    max: 5.0
  npc_overrides:
    walker_first:
      initial_x:
        min: 32.0
        max: 48.0
      parameters:
        trigger_value:
          min: 22.0
          max: 34.0
    walker_second:
      initial_x:
        min: 45.0
        max: 62.0
      parameters:
        trigger_value:
          min: 18.0
          max: 30.0
    walker_third:
      initial_x:
        min: 58.0
        max: 80.0
      parameters:
        trigger_value:
          min: 15.0
          max: 26.0

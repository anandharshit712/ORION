scenario:
  name: "INT-001 Four-Way Stop — Yield to Right-of-Way Vehicle"
  version: "1.0"
  description: >
    Ego approaches a four-way stop. Crossing vehicle arrives first and has right-of-way.
    Ego must yield until the crossing vehicle clears the intersection, then proceed.
    Tests stop compliance and gap acceptance logic.
  duration: 25.0

ego:
  initial:
    x: -60.0
    y: -1.75
    heading: 0.0
    velocity: 8.33    # 30 km/h approaching the stop
  constraints:
    max_velocity: 13.89
    max_acceleration: 3.0
    max_deceleration: 8.0
    max_steering: 0.5

environment:
  road:
    type: urban
    lanes: 2
    lane_width: 3.5
    speed_limit: 11.11   # 40 km/h
    template: four_way_intersection
    template_params:
      arm_length: 80.0
      has_traffic_light: false   # stop-controlled, not signalised
  weather:
    condition: clear
    visibility: 1000.0

traffic:
  # Crossing vehicle with right of way, approaching from the right (south)
  - id: crossing_vehicle
    type: car
    initial:
      x: 0.0     # on the south arm, which meets the junction at the origin
      y: -60.0   # timed to reach the junction as the ego does
      heading: 1.5708   # heading north (pi/2)
      velocity: 8.33    # 30 km/h
    behavior:
      type: constant_velocity
      parameters: {}

termination:
  conditions:
    - collision
    - off_road
    - timeout
  timeout: 25.0

master_seed: 3001
parameterization:
  # Whether the crossing vehicle arrives before, with, or after the ego is the
  # entire test. Its speed and start distance set that timing.
  ego_velocity:
    min: 5.56      # 20 km/h
    max: 11.11     # 40 km/h
  npc_overrides:
    crossing_vehicle:
      initial_velocity:
        min: 5.56
        max: 11.11

master_seed: 3001

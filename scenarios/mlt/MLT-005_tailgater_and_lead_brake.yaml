scenario:
  name: "MLT-005 Tailgater and Lead Brake - Squeezed From Both Ends"
  version: "2.0"
  description: >
    A vehicle tailgates the ego while the lead brakes hard. The safe response to
    the lead is the dangerous one for the tailgater, and the tailgater is the
    participant the ego cannot control. The requirement is that the space behind
    is part of the problem: a model that brakes at maximum every time is not
    obviously right here, and one that ignores what is behind is obviously
    wrong.
  duration: 25.0

ego:
  initial:
    x: 0.0
    y: -1.75
    heading: 0.0
    velocity: 25.0
  constraints:
    max_velocity: 33.33
    max_acceleration: 3.0
    max_deceleration: 8.83
    max_steering: 0.5

environment:
  road:
    type: highway
    lanes: 2
    lane_width: 3.5
    speed_limit: 27.78
  weather:
    condition: clear
    visibility: 1000.0

traffic:
  - id: braking_lead
    type: car
    initial:
      x: 48.0
      y: -1.75
      heading: 0.0
      velocity: 25.0
    behavior:
      type: reactive_vehicle
      parameters:
        bt_type: hesitant_brake
        trigger_type: time
        trigger_value: 5.0
        initial_decel: -5.5
        initial_brake_duration:
          min: 0.3
          max: 0.9
        hesitation_prob: 0.25
        final_decel: -9.0
        min_velocity: 0.0
        max_velocity: 30.0
  - id: tailgater
    type: car
    initial:
      x: -22.0
      y: -1.75
      heading: 0.0
      velocity: 25.0
    behavior:
      type: reactive_vehicle
      parameters:
        bt_type: adaptive_tailgate
        trigger_type: time
        trigger_value: 0.0
        target_gap:
          min: 16.0
          max: 30.0
        max_velocity: 33.33

termination:
  conditions:
    - collision
    - off_road
    - timeout
  timeout: 25.0

master_seed: 6005

parameterization:
  ego_velocity:
    min: 20.83
    max: 29.17
  ego_x_jitter:
    min: 0.0
    max: 5.0
  npc_overrides:
    braking_lead:
      initial_x:
        min: 38.0
        max: 66.0
      parameters:
        trigger_value:
          min: 3.5
          max: 7.0
        final_decel:
          min: -9.81
          max: -7.0
    tailgater:
      initial_x:
        min: -34.0
        max: -16.0
      parameters:
        target_gap:
          min: 14.0
          max: 34.0

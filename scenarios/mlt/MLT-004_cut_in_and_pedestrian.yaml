scenario:
  name: "MLT-004 Cut-In and Pedestrian - Two Hazards Wanting Opposite Responses"
  version: "2.0"
  description: >
    A vehicle cuts in from the adjacent lane while a pedestrian enters from the
    kerb ahead. Each hazard alone has a clear answer and the answers conflict:
    braking for the cut-in closes the distance to nothing but costs the room
    needed for the pedestrian, and steering away from the cut-in aims at the
    kerb. The requirement is prioritising under conflict rather than reacting
    to whichever arrived first.
  duration: 24.0

ego:
  initial:
    x: 0.0
    y: -1.75
    heading: 0.0
    velocity: 16.67
  constraints:
    max_velocity: 25.0
    max_acceleration: 3.0
    max_deceleration: 8.83
    max_steering: 0.5

environment:
  road:
    type: urban
    lanes: 2
    lane_width: 3.5
    speed_limit: 16.67
  weather:
    condition: clear
    visibility: 900.0

traffic:
  - id: cutting_vehicle
    type: car
    initial:
      x: 24.0
      y: 1.75
      heading: 0.0
      velocity: 16.67
    behavior:
      type: reactive_vehicle
      parameters:
        bt_type: hesitant_cut_in
        trigger_type: time
        trigger_value: 3.0
        signal_duration:
          min: 0.2
          max: 0.8
        abort_prob: 0.25
        lateral_target_y: -1.75
        lateral_speed:
          min: 1.2
          max: 2.8
  - id: kerb_pedestrian
    type: pedestrian
    initial:
      x: 62.0
      y: -7.0
      heading: 1.5708
      velocity: 1.3
    behavior:
      type: pedestrian
      parameters:
        bt_type: cautious_pedestrian
        trigger_type: proximity
        trigger_value: 26.0
        walk_speed:
          min: 1.0
          max: 1.9
        hesitate_prob: 0.25

termination:
  conditions:
    - collision
    - off_road
    - timeout
  timeout: 24.0

master_seed: 6004

parameterization:
  ego_velocity:
    min: 13.89
    max: 20.83
  ego_x_jitter:
    min: 0.0
    max: 6.0
  npc_overrides:
    cutting_vehicle:
      initial_x:
        min: 16.0
        max: 34.0
      parameters:
        trigger_value:
          min: 2.0
          max: 5.0
    kerb_pedestrian:
      initial_x:
        min: 48.0
        max: 78.0
      parameters:
        trigger_value:
          min: 20.0
          max: 32.0

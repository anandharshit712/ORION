# AREP Default Configuration
# Override per-environment in {env}.yaml or via AREP_* environment variables.

env: development
debug: false
enable_visualization: true

simulation:
  timestep: 0.02          # seconds (50 Hz)
  max_duration: 60.0      # seconds
  max_steps: 3000
  vehicle_length: 4.5     # metres
  vehicle_width: 2.0
  wheelbase: 2.7
  max_velocity: 35.0      # m/s (~126 km/h)
  max_acceleration: 3.0   # m/s²
  max_deceleration: 8.0
  max_steering_angle: 0.5 # radians
  collision_tolerance: 0.000001

execution:
  num_workers: 4
  model_timeout_ms: 50
  default_num_runs: 100
  default_master_seed: 42

# Customer-model sandbox limits (Phase 0.2 / defect D-01).
# Security limits, not perf tuning — raising them widens the blast radius of a
# hostile model artefact. Env overrides: ORION_SANDBOX_*.
sandbox:
  predict_timeout_s: 5.0        # hard wall-clock kill per predict()/reset() call
  total_wallclock_s: 300.0      # hard wall-clock budget for one run
  cpu_seconds: 60               # RLIMIT_CPU (POSIX only)
  memory_bytes: 536870912       # RLIMIT_AS — 512 MB
  max_file_bytes: 67108864      # RLIMIT_FSIZE — 64 MB, tmpdir only
  max_open_files: 64            # RLIMIT_NOFILE
  require_network_namespace: false  # true = refuse to run without kernel net isolation

database:
  url: "sqlite:///arep.db"
  echo: false
  pool_size: 5

paths:
  scenarios_dir: "scenarios"
  results_dir: "results"
  logs_dir: "logs"
  models_dir: "models"

api:
  host: "0.0.0.0"
  port: 8000
  debug: false

  # ── Security controls (Phase 0.3, defect D-03) ──────────────────────────
  # CORS origins are deployment-specific, so they live in the environment,
  # not here: ORION_ALLOWED_ORIGINS="https://app.example.com,https://admin.example.com".
  # The built-in default is the two local dev servers. A non-dev ORION_ENV
  # refuses to boot on "*" — see arep/config/validate.py.
  #
  # Rate limits use slowapi syntax ("5/minute", "3/hour"). Set
  # rate_limit_enabled: false only in tests that need to hammer an endpoint.
  rate_limit_enabled: true
  rate_limit_login: "5/minute"       # per IP
  rate_limit_signup: "3/hour"        # per IP
  rate_limit_default: "120/minute"   # per principal (API key / org / IP)
  # memory:// counts per process. With >1 uvicorn worker, point this at the
  # Redis the Celery queue already runs on: redis://localhost:6379/1
  rate_limit_storage_uri: "memory://"
  # Honour X-Forwarded-For for the client IP. Enable ONLY behind a proxy you
  # control, otherwise clients spoof the header to reset their own limits.
  trust_proxy_headers: false
# ── Billing ───────────────────────────────────────────────────────────────
# Set billing_enabled: true and provide Stripe keys via env vars when ready
# to go live. Everything else (credit deduction, refund, org isolation) works
# regardless of this flag — only Stripe replenishment is gated.
#
# To go live:
#   1. Set billing_enabled: true  (or AREP_BILLING_ENABLED=true)
#   2. Set STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, STRIPE_PUBLISHABLE_KEY
#   3. Replace placeholder price IDs in billing.py with real Stripe IDs
billing:
  billing_enabled: false   # flip to true when Stripe is wired
  beta_credits: 1000       # credits granted to new orgs during beta

[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arep"
version = "0.1.0"
description = "Autonomous Robustness Evaluation Platform"
requires-python = ">=3.10"
dependencies = [
    "numpy==1.26.0",
    "scipy==1.11.3",
    "pyyaml==6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    # Linters are pinned for the same reason numpy and scipy are: an unpinned
    # tool makes CI fail on a day nobody changed any code. Ruff 0.16 turned on
    # whole rule families by default (UP, I, DTZ, SIM, PL, RUF) and produced 862
    # findings against a tree that had been clean for months, which is what
    # every Lint run on this repo had been failing on. Upgrade deliberately,
    # with the diff in its own commit.
    "black==26.3.1",
    "ruff==0.15.12",
    "mypy==1.20.2",
    "pytest-asyncio>=0.23.0",
    "httpx>=0.25.0",            # async test client for FastAPI
]
api = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",          # [P1] database migrations
    "psycopg2-binary>=2.9.0",
    "bcrypt>=4.0.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "python-multipart>=0.0.6",
    "slowapi>=0.1.9",           # [P0.3] rate limiting (D-03)
    "stripe>=7.0.0",            # [P1] billing integration
    "jinja2>=3.1.0",            # [P2] report templates
    "python-dotenv>=1.0.0",     # [P1] .env loading
]
worker = [
    "celery>=5.3.0",            # [P1] async task queue
    "redis>=5.0.0",             # [P1] Celery broker + result backend
    "flower>=2.0.0",            # [P1] Celery monitoring UI (optional)
    "cloudpickle>=3.0.0",       # [P1] model serialisation
]
search = [
    "cma>=3.3.0",               # [P2] CMA-ES adversarial search
    "scikit-learn>=1.3.0",      # [P2] DBSCAN failure clustering
]
# Everything in [search] plus [reporting] is needed for the Phase 2 analysis
# modules; the API and worker do not import them.
reporting = [
    "weasyprint>=60.0",         # [P2] HTML → PDF generation
    "jinja2>=3.1.0",            # [P2] report templates
]
maps = [
    # No extra deps — xodr_parser uses stdlib xml.etree only
]
ros2 = [
    "pyzmq>=25.0",              # [P4] ZMQ transport for ROS2 bridge
    # rclpy is installed via ROS2 environment, not pip
]
all = [
    "arep[api,worker,search,reporting,maps]",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.ruff]
# The rule set is a decision this repository makes, not whatever the installed
# ruff defaults to this month. These four are what ruff shipped as its default
# through 0.15 and what the tree is clean against: pycodestyle errors (E4/E7/E9)
# and pyflakes (F).
#
# Widening it is welcome and is its own piece of work: turn on one family, fix
# what it finds, land that. Doing it by accident through a version bump means a
# red pipeline on an unrelated change, which is how a lint gate gets ignored.
lint.select = ["E4", "E7", "E9", "F"]

[tool.mypy]
python_version = "3.10"
files = ["arep"]
# Deliberately not --strict. The point of running mypy here is to catch the
# errors that bite at runtime — None flowing into something that dereferences it
# — not to annotate every local. Tighten per-module as code gets cleaned up.
warn_redundant_casts = true
warn_unused_ignores = true

# Third-party packages with no type information. Several genuinely ship none
# (celery, cma, weasyprint, sklearn); the rest are optional extras that are not
# installed in every environment, so a missing-import error says nothing about
# this codebase.
[[tool.mypy.overrides]]
module = [
    "boto3.*",
    "celery.*",
    "cma.*",
    "jose.*",
    "scipy.*",
    "sklearn.*",
    "weasyprint.*",
    "yaml.*",
]
ignore_missing_imports = true
